<style>

  .mosaic-grid {
    column-count: 1; /* Default to 1 column for mobile */
    column-gap: 1rem;
  }

  /* Medium screens (tablets) */
  @media (min-width: 600px) {
    .mosaic-grid {
      column-count: 2;
    }
  }

  /* Large screens (laptops/desktops) */
  @media (min-width: 900px) {
    .mosaic-grid {
      column-count: 3;
    }
  }

  .mosaic-grid img {
    width: 100%;       /* Force image to fit the column width */
    height: auto;      /* Maintain aspect ratio */
    display: block;
    margin-bottom: 1rem; /* Space between images vertically */
    break-inside: avoid; /* Prevent images from being cut across columns */
    border-radius: 1px; /* Optional: adds rounded corners */
  }
</style>

<div class="mosaic-grid">
  {{ .Inner | markdownify }}
</div>
