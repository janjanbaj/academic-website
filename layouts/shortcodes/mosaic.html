<div class="mosaic-grid" id="mosaic-{{ .Ordinal }}">
  {{ .Inner | markdownify }}
</div>

<style>
  .mosaic-grid {
    column-count: 1;
    column-gap: 1rem;
    width: 100%;
    margin: 2rem 0;
  }

  @media (min-width: 600px) { .mosaic-grid { column-count: 2; } }
  @media (min-width: 900px) { .mosaic-grid { column-count: 3; } }

  /* Target the images directly and their parent containers */
  .mosaic-grid img {
    width: 100% !important;
    height: auto !important;
    display: block !important;
    margin: 0 0 1rem 0 !important; /* Bottom margin only */
    break-inside: avoid;
    border: none !important;
    padding: 0 !important;
    box-shadow: none !important;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.2s ease-in-out;
  }

  .mosaic-grid img:hover {
    transform: scale(1.02);
  }

  /* Remove margins from the <p> tags Hugo creates automatically */
  .mosaic-grid p {
    margin: 0 !important;
    padding: 0 !important;
    display: contents; /* Makes the <p> tag 'invisible' to the layout */
  }

  /* Modal Styles */
  #mosaic-modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
  }

  #mosaic-modal-content {
    max-width: 90%;
    max-height: 80vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    border: 2px solid var(--primary-color, #fff);
    border-radius: 4px;
    object-fit: contain;
  }

  #mosaic-modal-caption {
    color: #fff;
    margin-top: 20px;
    font-family: inherit;
    text-align: center;
    font-size: 1.2rem;
    max-width: 80%;
  }

  #mosaic-modal-close {
    position: absolute;
    top: 30px;
    right: 40px;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.3s;
    line-height: 1;
  }

  #mosaic-modal-close:hover {
    color: var(--primary-color, #aaa);
    text-decoration: none;
  }

  body.modal-open {
    overflow: hidden;
  }
</style>

<!-- Single modal for the entire page, added only once if possible -->
<script>
  (function() {
    // Utility function to create the modal if it doesn't exist
    function ensureModal() {
      let modal = document.getElementById("mosaic-modal");
      if (!modal) {
        modal = document.createElement("div");
        modal.id = "mosaic-modal";
        modal.innerHTML = `
          <span id="mosaic-modal-close">&times;</span>
          <img id="mosaic-modal-content">
          <div id="mosaic-modal-caption"></div>
        `;
        document.body.appendChild(modal);

        const closeBtn = document.getElementById("mosaic-modal-close");
        closeBtn.onclick = closeModal;
        modal.onclick = function(event) {
          if (event.target === modal) {
            closeModal();
          }
        };

        document.addEventListener('keydown', function(e) {
          if (e.key === "Escape") closeModal();
        });
      }
      return modal;
    }

    function openModal(imgSrc, altText) {
      const modal = ensureModal();
      const modalImg = document.getElementById("mosaic-modal-content");
      const caption = document.getElementById("mosaic-modal-caption");
      
      modal.style.display = "flex";
      modalImg.src = imgSrc;
      caption.innerHTML = altText;
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      const modal = document.getElementById("mosaic-modal");
      if (modal) {
        modal.style.display = "none";
        document.body.classList.remove('modal-open');
      }
    }

    // This ensures that even if Hugo wraps images in P tags, 
    // they won't break the column flow.
    function initMosaic() {
      const grid = document.getElementById("mosaic-{{ .Ordinal }}");
      if (!grid) return;
      
      const images = grid.getElementsByTagName('img');
      for (let img of images) {
        // Ensure the parent element (likely a P tag) is controlled
        if (img.parentElement && img.parentElement.tagName === 'P') {
          img.parentElement.style.breakInside = "avoid";
          img.parentElement.style.display = "inline-block";
          img.parentElement.style.width = "100%";
        }
        
        // Add click listener for modal
        img.addEventListener('click', function() {
          openModal(this.src, this.alt);
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initMosaic);
    } else {
      initMosaic();
    }
  })();
</script>
